             alt="Viettel Logo" 
             class="logo-img">
        <span>Viettel</span>
      </div>
      <nav>
        <ul>
          <li><a href="#home" class="active">Trang chủ</a></li>

        <ul>
          <li><a href="#home" (click)="closeMenu()">Trang chủ</a></li>
          <li><a href="#plans" (click)="closeMenu()">Gói cước</a></li>
          <li><a href="#about" (click)="closeMenu()">Về Viettel</a></li>
